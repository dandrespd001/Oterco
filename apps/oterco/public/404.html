<!doctype html>
<!--
  OT-08 — 404 estático (fixture técnico, no publicable).
  Sin SSR, sin fallback de SPA, sin elementos ejecutables, sin redirección.
  El destino sirve este fichero con estado 404 real (humo en OT-16).
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="FIXTURE OT-08 — página no encontrada del prototipo editorial no publicable de OTERCO."
    />
    <title>Página no encontrada (404) — OTERCO (fixture, no publicable)</title>
    <!-- canonical pendienteAP: sin dominio aprobado no se emite URL real. -->
    <!--
      OT-11 (Q042) — Sin elemento style embebido: el bloque OT-10.F4 se
      revierte por decisión de la coordinadora para una CSP eficaz a futuro
      (sin 'unsafe-inline'). La 404 no referencia el bundle con hash; el
      skip-link queda funcional y visible en flujo nativo (sin
      posicionamiento absoluto): enlaces y foco por defecto del navegador.
      Sin scripts, sin noindex alterado, sin red ni referencias externas.
    -->
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main id="contenido">
      <p>Fixture técnico — no publicable</p>
      <h1>Página no encontrada (404)</h1>
      <p>
        La ruta solicitada no existe en este prototipo. El sitio no usa
        fallback de aplicación de página única: las rutas inexistentes son
        un 404 real.
      </p>
      <p><a href="/">Volver al inicio</a></p>
    </main>
  </body>
</html>
